models:
  - type: main
    engine: openai
    model: qwen/qwen3.8-27b
    api_key_env_var: GROQ_API_KEY
    parameters:
      base_url: https://api.groq.com/openai/v1

prompts:
  - task: self_check_input
    content: |
      Your task is to determine whether the user message should be blocked.
      Return "yes" if the message is unsafe or should be blocked.
      Return "no" if the message is safe and can be answered.

      User message: "{{ user_input }}"

  - task: self_check_output
    content: |
      Your task is to determine whether the assistant response should be blocked.
      Return "yes" if the response is unsafe or inappropriate.
      Return "no" if the response is safe and appropriate.

      Assistant response: "{{ bot_response }}"

rails:
  input:
    flows:
      - self check input
  output:
    flows:
      - self check output
